source_model:  # offset transfer (Eq. 1-3)
  type: HistGradientBoostingRegressor
  max_iter: 300
  learning_rate: 0.05
  random_state: 0
  features: [N, ap, ae, F, Z, D, dir, MRR, fz, ae_D, ap_D, vc, hm]   # 13 features; no material/tool identity
  offset: median residual on target calibration cuts
physics_model:  # Eq. 4-5, src/bench2.py fit_reg
  speed_normalisation: "u = N / 1e4"
  Q: "ap * ae * F  (mm^3/s)"
  chip_thickness: "h = 2 * fz * sqrt(a * (1 - a)); fz = 60 * F / (N * Z); a = clip(ae / D, 1e-4, 1); h clipped to >= 1e-3 mm"
  h0_mm: 0.05
  loss: soft_l1
  f_scale_W: 300
  solver: scipy.optimize.least_squares (trust-region reflective, bounded)
  bounds: {b0: [0.3, 1.05] x median calibration power, b1: [-5000, 5000], b2: [-5000, 5000], m: [0, 0.6], K_m: [0.2, 8] W/(mm^3/s) (fitted as exp(theta))}
  start:  {b0: 0.8 x median calibration power, b1: 0, b2: 0, m: 0.2, K_m: 1.5}
  missing_material: "K_m stays at the starting value 1.5 (algorithmic fallback)"
gaussian_process:  # src/bench2.py
  inputs: [N/1e4, log10(MRR + 1e-3), ap_D, log10(hm + 1e-3)]   # standardised on the calibration set
  kernel: "ConstantKernel(1e4) * RBF(ARD, length_scale_bounds=(0.1, 20)) + WhiteKernel(5e4)"
  normalize_y: false
gbm_target_only: same estimator as source_model, trained on target calibration cuts only
